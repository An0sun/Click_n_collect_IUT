tags: [auth]
summary: Changer le mot de passe
description: |
  Permet à un utilisateur connecté de modifier son mot de passe actuel.  
  Nécessite un JWT valide.
consumes: [application/json]
security:
  - BearerAuth: []
parameters:
  - in: body
    name: body
    required: true
    schema:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          example: "ancienMDP123"
        new_password:
          type: string
          example: "nouveauMDP456"
responses:
  204:
    description: Mot de passe changé avec succès (aucun contenu)
  401:
    description: Mot de passe actuel invalide
    schema:
      $ref: "#/definitions/ErrorUnauthorizedResponse"
  422:
    description: Données invalides
    schema:
      $ref: "#/definitions/ErrorUnprocessableEntityResponse"
