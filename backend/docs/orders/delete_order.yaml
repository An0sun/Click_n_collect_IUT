tags: [orders]
summary: Supprime une commande
description: |
  Supprime une commande existante à partir de son **ID**.

parameters:
  - in: path
    name: order_id
    type: integer
    required: true
    description: Identifiant de la commande à supprimer.

responses:
  204:
    description: Commande supprimée avec succès (aucun contenu retourné).

  404:
    description: Commande introuvable.
    schema:
      $ref: '#/definitions/ErrorNotFoundResponse'
