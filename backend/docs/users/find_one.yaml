tags: [users]
summary: Récupérer un utilisateur par ID
description: |
  Renvoie les informations publiques d’un utilisateur spécifique.  
  Réservé aux administrateurs.
parameters:
  - name: user_id
    in: path
    type: integer
    required: true
    description: ID de l’utilisateur recherché
responses:
  200:
    description: Détails de l’utilisateur
    schema:
      $ref: "#/definitions/PublicUserDTO"
  404:
    description: Utilisateur introuvable
    schema:
      $ref: "#/definitions/ErrorNotFoundResponse"
  403:
    description: Accès refusé
    schema:
      $ref: "#/definitions/ErrorForbiddenResponse"
