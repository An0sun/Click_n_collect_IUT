<div class="max-w-5xl mx-auto p-4 mt-12">
    <h1 class="text-xl font-semibold text-gray-900">My Cart</h1>

    <div class="grid lg:grid-cols-3 lg:gap-x-8 gap-y-8 mt-6">
      <div class="lg:col-span-2 space-y-6">
        @for (item of cart; track item.product.id) {
          <div class="flex gap-4 bg-white px-4 py-6 rounded-md shadow-sm border border-gray-200">
            <div class="flex gap-6 sm:gap-4 max-sm:flex-col">
              <div class="w-24 h-24 shrink-0">
                <img
                  [src]="'https://images.unsplash.com/photo-1757743066455-4b5b471cdb80?q=80&w=600&auto=format&fit=crop'"
                  alt="{{ item.product.name }}"
                  class="w-full h-full object-contain"
                />
              </div>
              <div class="flex flex-col gap-4">
                <h3 class="text-sm sm:text-base font-semibold text-gray-900">
                  {{ item.product.name }}
                </h3>
                <p class="text-gray-600">{{ item.product.description }}</p>
                <h3 class="text-sm font-semibold text-amber-700">
                  {{ item.product.price }} €
                </h3>
              </div>
            </div>

            <div class="ml-auto flex flex-col items-end justify-between">
                <button
                (click)="remove(item.product.id)"
                class="text-red-500 hover:text-red-700 mb-3 flex items-center gap-1"
                title="Remove product"
              >
                <span class="hidden sm:inline">Remove</span>
              </button>

              <div class="flex items-center gap-3">
                <button (click)="decrease(item.product.id)"
                  class="w-7 h-7 flex items-center justify-center bg-amber-500 text-white rounded-full hover:bg-amber-600">-</button>
                <span class="font-semibold">{{ item.quantity }}</span>
                <button (click)="increase(item.product.id)"
                  class="w-7 h-7 flex items-center justify-center bg-amber-700 text-white rounded-full hover:bg-amber-800">+</button>
              </div>
            </div>
          </div>
        } @empty {
          <p class="text-gray-500">Your cart is empty.</p>
        }
      </div>

      <div class="bg-white rounded-md px-4 py-6 shadow-sm border border-gray-200 h-max">
        <ul class="text-gray-600 font-medium space-y-4">
          <li class="flex justify-between text-sm">
            <span>Subtotal</span>
            <span class="font-semibold text-gray-900">{{ total }} €</span>
          </li>
          <hr class="border-gray-300" />
          <li class="flex justify-between text-sm font-semibold text-gray-900">
            <span>Total</span>
            <span class="text-amber-700">{{ total }} €</span>
          </li>
        </ul>

        <div class="mt-8 space-y-4">
          <button (click)="validateOrder()" class="w-full px-4 py-2.5 text-sm font-medium bg-amber-700 text-white rounded-md hover:bg-amber-800">
            Validate the order
          </button>
          <button
            class="w-full px-4 py-2.5 text-sm font-medium border border-gray-300 rounded-md bg-gray-50 hover:bg-gray-100"
            (click)="goToProducts()">
            Continue Shopping
          </button>
        </div>
      </div>
    </div>
  </div>
