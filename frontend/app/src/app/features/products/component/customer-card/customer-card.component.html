@if (product) {
  <div class="border rounded-lg shadow p-4 bg-white">
    <h2 class="font-bold text-lg truncate">{{ product.name }}</h2>
    <p class="text-gray-600 truncate">{{ product.description }}</p>
    <p class="mt-2 text-green-600 font-semibold">{{ product.price }} €</p>
    <p class="text-sm text-gray-500">Stock : {{ product.stock }}</p>

    <button class="mt-4 block rounded-md bg-teal-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-teal-700">
      add card
    </button>
  </div>
}
