@if (product) {
  <div
    class="group relative bg-card rounded-2xl overflow-hidden shadow-md
           border border-borderSubtle hover:border-primary/50
           max-w-xs w-full text-sm text-text transition"
  >


    <div class="relative">
      <div class="w-full h-40 overflow-hidden bg-gray-100">
        <img
          [src]="product.imageUrl || placeholderUrl"
          [alt]="product.name"
          class="h-full w-full object-cover transition duration-500 group-hover:scale-110"
        />
      </div>

      <div
        class="absolute top-2 right-2 px-2 py-1 rounded-full text-[10px]
               font-semibold uppercase tracking-wide shadow-md
               bg-primary text-white"
      >
        {{ product.stock > 0 ? 'Available' : 'Out of stock' }}
      </div>
    </div>

    <div class="p-3.5 space-y-2 border-t border-borderSubtle">
      <h3 class="text-base font-semibold text-text truncate">
        {{ product.name }}
      </h3>

      <p class="text-xs text-muted line-clamp-2">
        {{ product.description }}
      </p>

      <p class="text-[11px] text-muted">
        Stock :
        <span class="font-semibold text-primary-dark">
          {{ product.stock }}
        </span>
      </p>

      <div class="mt-2.5 flex items-center justify-between gap-2">
        <span
          class="font-bold text-base text-primary-dark px-2 py-0.5 rounded-full
                 bg-primary-light/30"
        >
          {{ product.price }} €
        </span>

        <div class="flex gap-1.5">
          <button
            class="bg-primary hover:bg-primary-dark text-white font-medium text-[11px]
                   py-1 px-3 rounded-lg shadow-sm transition
                   disabled:opacity-40 disabled:cursor-not-allowed"
            (click)="addToCart(product)"
            [disabled]="product.stock <= 0"
          >
            Add to cart
          </button>

        </div>
      </div>
    </div>
  </div>
}
