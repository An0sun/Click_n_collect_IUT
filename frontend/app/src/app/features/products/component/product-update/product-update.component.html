<div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl border shadow p-5 w-full max-w-xl">
    <h2 class="text-xl font-semibold mb-4">Modifier le produit #{{ product.id }}</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <label class="block">
          <span class="block text-sm mb-1">Nom</span>
          <input type="text" formControlName="name" class="border rounded px-3 py-2 w-full" />
        </label>

        <label class="block">
          <span class="block text-sm mb-1">Catégorie</span>
          <select formControlName="category" class="border rounded px-3 py-2 w-full">
            <option value="Food">Food</option>
            <option value="Beverage">Beverage</option>
          </select>
        </label>

        <label class="block md:col-span-2">
          <span class="block text-sm mb-1">Description</span>
          <input type="text" formControlName="description" class="border rounded px-3 py-2 w-full" />
        </label>

        <label class="block">
          <span class="block text-sm mb-1">Prix</span>
          <input type="number" step="0.01" min="0" formControlName="price"
                 class="border rounded px-3 py-2 w-full text-right" />
        </label>

        <label class="block">
          <span class="block text-sm mb-1">Stock</span>
          <input type="number" min="0" formControlName="stock"
                 class="border rounded px-3 py-2 w-full text-right" />
        </label>
      </div>

      <div class="mt-5 flex gap-2 justify-end">
        <button type="button" class="px-3 py-2 rounded-lg border" (click)="cancel.emit()" [disabled]="saving">
          Annuler
        </button>
        <button type="submit" class="px-3 py-2 rounded-lg border" [disabled]="saving || form.invalid">
          {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </div>
</div>
