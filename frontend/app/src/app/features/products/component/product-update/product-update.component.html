<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
  <div class="w-full max-w-xl rounded-2xl border border-gray-200 bg-white shadow-xl">
    <div class="p-5">
      <h2 class="mb-4 text-xl font-semibold text-gray-900">
        Modifier le produit #{{ product.id }}
      </h2>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
          <label class="block">
            <span class="mb-1 block text-sm text-gray-700">Nom</span>
            <input
              type="text"
              formControlName="name"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 placeholder:text-gray-400 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
            />
          </label>

          <label class="block">
            <span class="mb-1 block text-sm text-gray-700">Catégorie</span>
            <select
              formControlName="category"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
            >
              <option value="Food">Food</option>
              <option value="Beverage">Beverage</option>
            </select>
          </label>

          <label class="block md:col-span-2">
            <span class="mb-1 block text-sm text-gray-700">Description</span>
            <input
              type="text"
              formControlName="description"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 placeholder:text-gray-400 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
            />
          </label>

          <label class="block">
            <span class="mb-1 block text-sm text-gray-700">Prix</span>
            <input
              type="number"
              step="0.01"
              min="0"
              formControlName="price"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-right text-gray-900 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
            />
          </label>

          <label class="block">
            <span class="mb-1 block text-sm text-gray-700">Stock</span>
            <input
              type="number"
              min="0"
              formControlName="stock"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-right text-gray-900 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
            />
          </label>

          <label class="block md:col-span-2">
            <span class="mb-1 block text-sm text-gray-700">Image URL (optionnel)</span>
            <input
              type="url"
              formControlName="imageUrl"
              class="w-full rounded-lg border border-gray-300 px-3 py-2 text-gray-900 placeholder:text-gray-400 focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-200"
              placeholder="https://..."
            />
          </label>
        </div>

        <div class="mt-5 flex justify-end gap-2">
          <button
            type="button"
            class="rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
            (click)="cancel.emit()"
            [disabled]="saving"
          >
            Annuler
          </button>
          <button
            type="submit"
            class="rounded-lg bg-amber-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-amber-700 disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="saving || form.invalid"
          >
            {{ saving ? 'Enregistrement…' : 'Enregistrer' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
