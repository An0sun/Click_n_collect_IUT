<div class="bg-white shadow-md rounded-xl overflow-hidden mt-6">
  <div class="overflow-x-auto">
    <table class="min-w-full divide-y divide-gray-200 text-sm">
      <thead class="bg-gray-50">
        <tr class="text-left text-xs font-semibold uppercase tracking-wide text-gray-600">
          <th class="px-6 py-3">#</th>
          <th class="px-6 py-3">Nom</th>
          <th class="px-6 py-3">Catégorie</th>
          <th class="px-6 py-3">Description</th>
          <th class="px-6 py-3">Prix</th>
          <th class="px-6 py-3">Stock</th>
          <th class="px-6 py-3">Actions</th>
        </tr>
      </thead>

      <tbody class="bg-white divide-y divide-gray-100">
        @if (loading) {
          <tr>
            <td colspan="7" class="px-6 py-6 text-center text-gray-500">
              Chargement…
            </td>
          </tr>
        } @else {
          @for (p of products; track trackById) {
            <tr class="hover:bg-gray-50 transition">
              <td class="px-6 py-4 font-medium text-gray-700">
                {{ p.id }}
              </td>

              <td class="px-6 py-4 text-gray-900 font-semibold">
                {{ p.name }}
              </td>

              <td class="px-6 py-4 text-gray-700">
                {{ p.category }}
              </td>

              <td class="px-6 py-4 text-gray-500 max-w-xs truncate">
                {{ p.description }}
              </td>

              <td class="px-6 py-4 text-gray-800 font-medium">
                {{ p.price | number:'1.2-2' }} €
              </td>

              <td class="px-6 py-4">
                <span
                  class="px-2 py-1 text-xs font-semibold rounded-full"
                  [class.bg-green-100]="p.stock > 10"
                  [class.text-green-800]="p.stock > 10"
                  [class.bg-yellow-100]="p.stock > 0 && p.stock <= 10"
                  [class.text-yellow-800]="p.stock > 0 && p.stock <= 10"
                  [class.bg-red-100]="p.stock === 0"
                  [class.text-red-800]="p.stock === 0"
                >
                  {{ p.stock }}
                </span>
              </td>

              <td class="px-6 py-4">
                <div class="flex flex-wrap gap-2">
                  <button
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold
                           border border-blue-600 text-blue-600 hover:bg-blue-600 hover:text-white transition"
                    (click)="editRequest.emit(p.id)"
                  >
                    Modifier
                  </button>
                  <button
                    class="px-3 py-1.5 rounded-lg text-xs font-semibold
                           border border-red-600 text-red-600 hover:bg-red-600 hover:text-white transition"
                    (click)="deleteProduct.emit(p.id)"
                  >
                    Supprimer
                  </button>
                </div>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
