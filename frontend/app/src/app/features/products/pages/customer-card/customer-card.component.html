@if (!loading && !error) {
  <div class="grid grid-cols-4 gap-6 min-h-[200px] items-center justify-center border rounded-lg p-4 bg-gray-50">
    @if (products.length === 0) {
      <p class="col-span-4 text-center text-gray-500">Aucun produit disponible</p>
    } @else {
      @for (product of products; track product.id) {
        <div class="border rounded-lg shadow p-4 bg-white">
          <h2 class="font-bold text-lg">{{ product.name }}</h2>
          <p class="text-gray-600">{{ product.description }}</p>
          <p class="mt-2 text-green-600 font-semibold">{{ product.price }} €</p>
          <p class="text-sm text-gray-500">Stock : {{ product.quantity }}</p>
        </div>
      }
    }
  </div>
}
