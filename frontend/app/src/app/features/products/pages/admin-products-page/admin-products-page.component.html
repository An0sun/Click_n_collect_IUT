<div class="p-4 md:p-6">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-semibold">Gestion des produits</h1>
    <a
      class="px-3 py-2 rounded-lg bg-amber-800 text-white hover:bg-amber-900"
      routerLink="/admin/create-product"
    >
      Créer un produit
    </a>
  </div>

  @if (loading) {
    <p class="text-gray-500">Chargement…</p>
  } @else {
    <app-admin-products-table
      [products]="products"
      [loading]="loading"
      [page]="page || 1"
      [pages]="pages || 1"
      [total]="total || 0"
      [perPage]="perPage"
      (pageChange)="onPageChange($event)"
      (editRequest)="onAskEdit($event)"
      (deleteProduct)="onDelete($event)"
    />
  }

  @if (!loading && products.length === 0) {
    <p class="text-gray-500 mt-3">Aucun produit.</p>
  }
</div>

@if (editingProduct) {
  <app-product-update
    [product]="editingProduct!"
    (saved)="onUpdateSaved()"
    (cancel)="onUpdateCancel()"
  ></app-product-update>
}
