<section class="mx-auto max-w-5xl px-6 py-16">
  <div
    class="relative overflow-hidden rounded-3xl border border-slate-200 bg-gradient-to-br from-white to-slate-50 p-10 shadow-sm dark:border-slate-800 dark:from-slate-900 dark:to-slate-950"
  >
    <div class="pointer-events-none absolute -right-12 -top-12 h-44 w-44 rounded-full bg-slate-200/50 blur-2xl dark:bg-slate-700/30"></div>
    <div class="pointer-events-none absolute -left-10 bottom-0 h-32 w-32 rounded-full bg-indigo-200/40 blur-2xl dark:bg-indigo-700/30"></div>

    <div class="relative">
      <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 dark:text-white">
        Welcome
      </h1>
      <p class="mt-3 max-w-2xl text-lg text-slate-600 dark:text-slate-300">
        Click & Collect – Log in or create an account.
      </p>

      <div class="mt-8 flex flex-wrap gap-3">
        <button
          type="button"
          routerLink="/auth/login"
          class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200 dark:focus:ring-slate-600"
        >
          Sign in
        </button>

        <button
          type="button"
          routerLink="/auth/register"
          class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-2 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700 dark:focus:ring-slate-700"
        >
          Sign up
        </button>
      </div>
    </div>
  </div>
</section>
