<section
  class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
>
  @for (it of visibleItems; track it.label) {
    <a
      [routerLink]="it.link"
      class="group relative flex flex-col gap-2 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md dark:border-slate-800 dark:bg-slate-900"
    >
      @if (it.icon) {
        <div
          class="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-slate-100 text-lg dark:bg-slate-800"
        >
          {{ it.icon }}
        </div>
      }
      <h3 class="text-base font-semibold text-slate-900 dark:text-white">
        {{ it.label }}
      </h3>
      @if (it.description) {
        <p class="text-sm leading-6 text-slate-600 dark:text-slate-300">
          {{ it.description }}
        </p>
      }

      <div
        class="pointer-events-none absolute right-4 top-5 opacity-0 transition group-hover:translate-x-0.5 group-hover:opacity-100"
      >
        ➜
      </div>
    </a>
  }
</section>
