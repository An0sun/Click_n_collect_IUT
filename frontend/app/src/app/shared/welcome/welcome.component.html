<section class="mx-auto max-w-6xl px-4 py-10">
  <div class="relative overflow-hidden rounded-2xl border border-slate-200 bg-gradient-to-br from-white to-slate-50 p-8 shadow-sm dark:border-slate-800 dark:from-slate-900 dark:to-slate-950">
    <div class="flex flex-col gap-2 md:flex-row md:items-center md:justify-between">
      <div>
        @if (role) {
          <p class="mt-1 text-slate-600 dark:text-slate-300">
            You are logged in as
            <span class="font-semibold text-slate-900 dark:text-white">{{ role }}</span>.
          </p>
        } 
        @else {
          <p class="mt-1 text-slate-600 dark:text-slate-300">
            You are not logged in.
          </p>
      <div class="mt-4 flex gap-2 md:mt-0">
        <a
          routerLink="/auth/login"
          class="inline-flex items-center justify-center rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-200 dark:hover:bg-slate-700"
        >
          Sign in
        </a>
        <a
          routerLink="/auth/register"
          class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-slate-800 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200"
        >
          Sign up
        </a>
      </div>
        }
      </div>

    </div>

    <div class="pointer-events-none absolute -right-10 -top-10 h-36 w-36 rounded-full bg-slate-200/50 blur-2xl dark:bg-slate-700/30"></div>
  </div>

  <div class="mt-8">
    <app-generic-home [items]="features"></app-generic-home>
  </div>
</section>
