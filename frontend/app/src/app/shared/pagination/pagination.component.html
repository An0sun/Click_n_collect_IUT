<ul class="flex flex-wrap justify-center gap-2 text-primary-dark mt-6">

  <li>
    <button
      (click)="loadPage(page - 1)"
      [disabled]="page === 1"
      class="grid w-8 h-8 sm:w-9 sm:h-9 place-content-center rounded-full border border-gray-300
             bg-white text-gray-700 hover:bg-primary hover:text-white hover:border-primary
             disabled:opacity-40 disabled:hover:bg-white disabled:hover:text-gray-700
             text-xs sm:text-sm transition-colors shadow-sm"
    >
      «
    </button>
  </li>

  @for (p of pages; track p) {
    <li>
      <button
        (click)="loadPage(p)"
        class="w-8 h-8 sm:w-9 sm:h-9 rounded-full border text-center text-xs sm:text-sm font-medium transition-colors shadow-sm"
        [ngClass]="{
          'bg-primary text-white border-primary hover:bg-primary-dark': page === p,
          'bg-white text-gray-700 border-gray-300 hover:bg-blue-50 hover:text-primary': page !== p
        }"
      >
        {{ p }}
      </button>
    </li>
  }

  <li>
    <button
      (click)="loadPage(page + 1)"
      [disabled]="page === totalPages"
      class="grid w-8 h-8 sm:w-9 sm:h-9 place-content-center rounded-full border border-gray-300
             bg-white text-gray-700 hover:bg-primary hover:text-white hover:border-primary
             disabled:opacity-40 disabled:hover:bg-white disabled:hover:text-gray-700
             text-xs sm:text-sm transition-colors shadow-sm"
    >
      »
    </button>
  </li>
</ul>
